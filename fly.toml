# fly.toml app configuration file generated for iocf-official on 2026-10-27T16:53:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'iocf-official'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
